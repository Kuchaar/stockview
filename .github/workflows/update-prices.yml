name: Update stock prices

on:
  schedule:
    # Every weekday at 18:00 UTC — after GPW closes at 17:00 CET
    - cron: '0 18 * * 1-5'
  workflow_dispatch: # Allow manual trigger

# Bot commituje public/data/ prosto na main — bez tego GITHUB_TOKEN bywa tylko do odczytu.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # Skrypt nie ma zależności — czyta tylko src/data/wig20.js i Yahoo.
      - name: Fetch latest prices from Yahoo Finance
        run: node scripts/fetch-stooq.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/history public/data/latest-prices.json
          if git diff --staged --quiet; then
            echo "No price changes detected"
          else
            git commit -m "chore: update stock prices $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
